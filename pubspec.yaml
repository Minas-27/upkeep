environment:
  sdk: ^3.6.0

executables:
  upkeep:

dependencies:
  args: ^2.6.0
  http: ^1.2.2
  path: ^1.9.0
  pub_semver: ^2.1.5
  yaml: ^3.1.2
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.15
